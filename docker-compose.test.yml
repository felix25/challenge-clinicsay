services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay
      POSTGRES_DB: clinicsay_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicsay -d clinicsay_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  provider:
    build: ./provider
    ports:
      - "127.0.0.1:4011:4010"
