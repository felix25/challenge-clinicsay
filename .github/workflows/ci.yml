name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Start E2E infrastructure
        run: |
          docker compose \
            -p clinicsay-e2e \
            -f docker-compose.test.yml \
            up -d --build --wait

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://clinicsay:clinicsay@localhost:5434/clinicsay_test
        run: npx prisma migrate deploy

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Infrastructure logs on failure
        if: failure()
        run: |
          docker compose \
            -p clinicsay-e2e \
            -f docker-compose.test.yml \
            logs

      - name: Stop E2E infrastructure
        if: always()
        run: |
          docker compose \
            -p clinicsay-e2e \
            -f docker-compose.test.yml \
            down -v
